name: Verify Link Compiler
on:
  pull_request:
  push:
    branches: [feature/link-compiler-v0.3.1]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Link source to bytecode and Rust native binary
        run: python -m linkc examples/rectangular.link -o /tmp/rectangular.lbc --rust-bin /tmp/link-rectangular
      - name: Compare LinkVM and native Rust JSON numerically
        run: |
          python - <<'PY'
          import json, subprocess
          vm = json.loads(subprocess.check_output(["python","-m","linkc","vm","/tmp/rectangular.lbc"]))
          native = json.loads(subprocess.check_output(["/tmp/link-rectangular"]))
          assert vm["shape"] == native["shape"] == [3,2]
          assert len(vm["matrix"]) == len(native["matrix"])
          for row_a,row_b in zip(vm["matrix"],native["matrix"]):
              for a,b in zip(row_a,row_b):
                  assert abs(a["re"]-b["re"])<1e-12
                  assert abs(a["im"]-b["im"])<1e-12
          print("PASS: native Rust matches LinkVM")
          PY
